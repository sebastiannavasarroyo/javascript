<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Parametros</title>
</head>
<body>
    <p>Primer Numero</p>
    <input type="number" id="primerNumero">
    <p>Segundo Numero</p>
    <input type="number" id="segundoNumero">
    <button onclick="mostrarResultado()">Calcular</button>
    <h2 id="textoResultado"></h2>

    <script>
        function sumar(numero1, numero2){
            resultado = numero1 + numero2
            return resultado;
        }

    function mostrarResultado(){
        let elementoNumero1 = parseInt(document.getElementById("primerNumero").value);
        let elementoNumero2 = parseInt(document.getElementById("segundoNumero").value);
        let elementTexto = document.getElementById("textoResultado");
        let elementoSuma = sumar(elementoNumero1.
        elementoNumero2);

        elementTexto.textContent = elementoSuma
    }
    </script>
</body>
</html>
