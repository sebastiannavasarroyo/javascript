<!DOCTYPE html>
<html>
<head>
    <title>Prácticas Loop For Of 2</title>
</head>
<body>
    <script>
        let miArray = ['Mensaje 1', 'Mensaje 2', 'Mensaje 3'];

        function testLoop() {
            for (let mensaje of miArray) {
                console.log(mensaje);
            }
        }

        testLoop();
    </script>
</body>
</html>
