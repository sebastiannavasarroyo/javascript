<!DOCTYPE html>
<html>
<head>
    <title>Prácticas Loop For Of 1</title>
</head>
<body>
    <script>
        let miArray =[5, 9, 6, 4, 8];
        let suma = 0;

        function testLoop() {
            for (let numero of miArray) {
                suma += numero;
            }
            console.log(suma);
        }

        testLoop();
    </script>
</body>
</html>
