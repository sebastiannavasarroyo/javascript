<!DOCTYPE html>
<html>
<head>
    <title>Prácticas Loop While 1</title>
</head>
<body>
    <script>
        function imprimirVueltas(vueltasTotales) {
            let contador = 1;
            while (contador <= vueltasTotales) {
                console.log("Vuelta número: " + contador);
                contador++;
            }
        }

        let usuarioVueltas = prompt("¿Cuántas vueltas quieres dar?");
        imprimirVueltas(usuarioVueltas);
    </script>
</body>
</html>
