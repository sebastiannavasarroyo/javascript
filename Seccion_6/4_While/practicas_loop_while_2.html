<!DOCTYPE html>
<html>
<head>
    <title>Prácticas Loop While 2</title>
</head>
<body>
    <script>
        function testLoop(numeroInicial) {
            let numero = Number(numeroInicial);
            while (numero <= 10) {
                console.log(numero);
                numero++;
            }
        }

        let valorUsuario = prompt("Introduce un número inicial menor a 10:");
        testLoop(valorUsuario);
    </script>
</body>
</html>
